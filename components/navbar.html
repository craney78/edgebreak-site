/* =========================================================

========================================================= */

.nav{

    gap:28px;

   BRAND

.brand-link:hover{
    transform:translateY(-1px);

.nav-logo{

    font-weight:850;

}

.live-badge::before{
    content:"";

    width:6px;
    height:6px;

    border-radius:50%;

    background:#22c55e;

    box-shadow:0 0 0 4px rgba(34,197,94,.10);
}


/* =========================================================
   DESKTOP NAV PILL
========================================================= */

.nav-links-wrap{
    display:flex;
    align-items:center;

}

.nav-links{

    padding:5px;

.nav-link{

    align-items:center;
    justify-content:center;

    gap:5px;

    padding:0 15px;

    color:var(--nav-text);

    text-decoration:none;

    font-size:13px;
    font-weight:720;

    white-space:nowrap;

    transition:
        color .18s ease,
        background .18s ease,
        transform .18s ease;
}

.nav-link:hover{
    background:#f5f8fb;
    color:var(--nav-ink);
}


/* =========================================================
   RESEARCH HUB
========================================================= */

.nav-hub{
    color:var(--nav-green-dark);

    font-weight:850;
}

.nav-hub::before{
    content:"✦";

    color:var(--nav-green);

    font-size:11px;
}

.nav-hub:hover{

    color:var(--nav-green-dark);
}


/* =========================================================
   LOGIN
========================================================= */

.nav-login{

    display:inline-flex;
    align-items:center;
    justify-content:center;

    padding:0 17px;

    border-radius:999px;

    color:var(--nav-ink);

    text-decoration:none;

    font-size:13px;

        color .18s ease;
}

.nav-login:hover{

    color:var(--nav-green-dark);
}


/* =========================================================
   BUY NOW
========================================================= */

.nav-buy{

    align-items:center;
    justify-content:center;

    padding:0 20px;

    border:1px solid #b9dcc4;
    border-radius:999px;

    background:
        linear-gradient(#ffffff,#ffffff) padding-box,
        linear-gradient(135deg,#16a34a,#2563eb) border-box;

    color:var(--nav-ink);

    text-decoration:none;

    font-size:13px;
    font-weight:850;

    white-space:nowrap;

    box-shadow:0 8px 22px rgba(15,23,42,.05);

.nav-buy:hover{

    color:var(--nav-green-dark);

    box-shadow:0 12px 28px rgba(15,23,42,.08);
}


/* =========================================================
   DROPDOWNS
========================================================= */

.dropdown{
    position:relative;
}

.desktop-arrow{
    margin-left:2px;

    color:#94a3b8;

    font-size:8px;
}

.mobile-arrow{
    display:none;
}

.dropdown-content{
    display:block !important;

    position:absolute;
    top:calc(100% - 3px);
    left:50%;

    min-width:280px;

    padding:8px;

    border:1px solid var(--nav-line);
    border-radius:18px;

    background:#ffffff;

    box-shadow:0 22px 55px rgba(15,23,42,.13);

    opacity:0;
    visibility:hidden;
    transform:translate(-50%,8px);

    pointer-events:none;

    transition:
        opacity .18s ease,
        visibility .18s ease,
        transform .18s ease;
}

.dropdown:hover .dropdown-content,
.dropdown:focus-within .dropdown-content{
    opacity:1;
    visibility:visible;

    transform:translate(-50%,0);

    pointer-events:auto;
}

.dropdown-content::before{
    content:"";

    position:absolute;
    top:-18px;
    left:-10px;
    right:-10px;

    height:22px;

    background:transparent;
    pointer-events:auto;
}

.dropdown-content a{
    display:flex;
    align-items:center;

    gap:11px;

    min-height:46px;

    padding:9px 12px;

    border-radius:11px;

    color:#475569;

    text-decoration:none;

    font-size:12px;
    font-weight:680;

    transition:
        background .16s ease,
        color .16s ease;
}

.dropdown-content a:hover{
    background:#f5f8fb;
    color:var(--nav-green-dark);
}

.dropdown-icon{
    width:18px;
    height:18px;

    flex:0 0 auto;

    color:var(--nav-green-dark);
    stroke:currentColor;
}


/* =========================================================
   HAMBURGER
========================================================= */

.menu-toggle{
    display:none;

    width:46px;
    height:46px;

    align-items:center;
    justify-content:center;

    border:1px solid var(--nav-line);
    border-radius:15px;

    background:#ffffff;
    color:var(--nav-ink);

    cursor:pointer;
}

.menu-icon{
    width:22px;
    height:22px;
}


/* =========================================================
   FOCUS
========================================================= */

.nav a:focus-visible,
.menu-toggle:focus-visible{
    outline:2px solid #22c55e;
    outline-offset:3px;
}


/* =========================================================
   MOBILE
========================================================= */

/* =========================================================
   DESKTOP DROPDOWN SAFETY
   Hard override for legacy /css/navbar.css
   No hover gap between trigger and menu
========================================================= */

@media(min-width:769px){

    .nav .dropdown{
        position:relative !important;
    }

    .nav .dropdown > .dropdown-content{
        display:block !important;

        top:calc(100% - 3px) !important;
        left:50% !important;

        margin:0 !important;

        opacity:0 !important;
        visibility:hidden !important;

        transform:translate(-50%,6px) !important;

        pointer-events:none !important;

        transition:
            opacity .16s ease,
            visibility .16s ease,
            transform .16s ease !important;
    }

    .nav .dropdown:hover > .dropdown-content,
    .nav .dropdown:focus-within > .dropdown-content,
    .nav .dropdown > .dropdown-content:hover{
        display:block !important;

        opacity:1 !important;
        visibility:visible !important;

        transform:translate(-50%,0) !important;

        pointer-events:auto !important;
    }

    /*
       Invisible hover bridge:
       overlaps the nav trigger and dropdown so there
       is no point where the mouse leaves the dropdown.
    */
    .nav .dropdown > .dropdown-content::before{
        content:"" !important;

        position:absolute !important;

        top:-20px !important;
        left:-14px !important;
        right:-14px !important;

        height:24px !important;

        background:transparent !important;

        pointer-events:auto !important;
    }

}


/* Legacy CSS conflict protection */
@media(min-width:769px){
    .nav,
    .nav-inner,
    .nav-links-wrap,
    .nav-links,
    .dropdown{
        overflow:visible !important;
    }
}
