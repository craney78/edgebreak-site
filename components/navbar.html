========================================================= */

.nav{

    top:0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:28px;
}

   BRAND
========================================================= */

.nav-left{
    display:flex;
    align-items:center;
    gap:10px;

    flex:0 0 auto;
}

.brand-link{
    width:74px;
    height:74px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:3px;

    border:1px solid #e3e9e5;

    background:#ffffff;

    padding:0 15px;

    text-decoration:none;

    font-size:13px;
    font-weight:720;

    white-space:nowrap;

    transition:
        color .18s ease,
        background .18s ease,
        transform .18s ease;
}

.nav-link:hover{
    background:#f5f8fb;
    color:var(--nav-ink);
}


/* =========================================================
   RESEARCH HUB
========================================================= */

.nav-hub{

    font-weight:850;

    color:var(--nav-green);

    font-size:11px;

.nav-hub:hover{

}


/* =========================================================
   LOGIN
========================================================= */

    min-height:46px;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    padding:0 17px;

    border-radius:999px;

    color:var(--nav-ink);

    text-decoration:none;

    font-size:13px;
    font-weight:800;

    transition:
        background .18s ease,
        color .18s ease;
}

.nav-login:hover{
    background:#f5f8fb;
    color:var(--nav-green-dark);
}

========================================================= */

    text-decoration:none;

    font-size:13px;

    color:var(--nav-green-dark);

========================================================= */

    position:relative;

.desktop-arrow{
    margin-left:2px;

    color:#94a3b8;

    font-size:8px;
}

.mobile-arrow{
    display:none;
}

.dropdown-content{
    display:block !important;

    position:absolute;
    top:calc(100% - 3px);
    left:50%;

    min-width:280px;

    padding:8px;

    border:1px solid var(--nav-line);
    border-radius:18px;

    background:#ffffff;

    box-shadow:0 22px 55px rgba(15,23,42,.13);

    opacity:0;
    visibility:hidden;
    transform:translate(-50%,8px);

    pointer-events:none;

    transition:
        opacity .18s ease,
        visibility .18s ease,
        transform .18s ease;
}

.dropdown:hover .dropdown-content,
.dropdown:focus-within .dropdown-content{
    opacity:1;
    visibility:visible;

    transform:translate(-50%,0);

    pointer-events:auto;
}

.dropdown-content::before{
    content:"";

    position:absolute;
    top:-18px;
    left:-10px;
    right:-10px;

    height:22px;

    background:transparent;
    pointer-events:auto;
}

.dropdown-content a{
    display:flex;
    align-items:center;

    gap:11px;

.dropdown-icon{
    width:18px;
    height:18px;

    flex:0 0 auto;

    color:var(--nav-green-dark);
    stroke:currentColor;

/* =========================================================
   HAMBURGER
========================================================= */

.menu-toggle{

    height:22px;

/* =========================================================
   FOCUS
========================================================= */

.menu-toggle:focus-visible{

    outline-offset:3px;
}

/* =========================================================
   DESKTOP DROPDOWN SAFETY
   Hard override for legacy /css/navbar.css
   No hover gap between trigger and menu
========================================================= */

@media(min-width:769px){

    .nav .dropdown{
        position:relative !important;
    }

    .nav .dropdown > .dropdown-content{
        display:block !important;

        top:calc(100% - 3px) !important;
        left:50% !important;

        margin:0 !important;

        opacity:0 !important;
        visibility:hidden !important;

        transform:translate(-50%,6px) !important;

        pointer-events:none !important;

        transition:
            opacity .16s ease,
            visibility .16s ease,
            transform .16s ease !important;
    }

    .nav .dropdown:hover > .dropdown-content,
    .nav .dropdown:focus-within > .dropdown-content,
    .nav .dropdown > .dropdown-content:hover{
        display:block !important;

        opacity:1 !important;
        visibility:visible !important;

        transform:translate(-50%,0) !important;

        pointer-events:auto !important;
    }

    /*
       Invisible hover bridge:
       overlaps the nav trigger and dropdown so there
       is no point where the mouse leaves the dropdown.
    */
    .nav .dropdown > .dropdown-content::before{
        content:"" !important;

        position:absolute !important;

        top:-20px !important;
        left:-14px !important;
        right:-14px !important;

        height:24px !important;

        background:transparent !important;

        pointer-events:auto !important;
    }

}

<script id="edgebreak-mobile-nav-auth-v4">
(function(){

    const MOBILE_MAX = 768;

    function isMobile(){
        return window.innerWidth <= MOBILE_MAX;
    }

    function getNavElements(){
        return {
            nav:
                document.querySelector(".nav"),

            auth:
                document.getElementById("authBtn"),

            buy:
                document.getElementById("navBuyBtn"),

            links:
                document.getElementById("navLinks")
        };
    }

    function setMobileAuthState(user){

        if(!isMobile()){
            return;
        }

        const {
            nav,
            auth,
            buy
        } = getNavElements();

        if(!nav || !auth){
            return;
        }

        const loggedIn =
            Boolean(user);

        nav.classList.toggle(
            "mobile-user-logged-in",
            loggedIn
        );

        auth.dataset.authState =
            loggedIn
                ? "logged-in"
                : "logged-out";

        if(loggedIn){

            auth.textContent =
                "Log Out";

            auth.href =
                "#";

            auth.setAttribute(
                "aria-label",
                "Log out of EdgeBreak"
            );

            if(buy){
                buy.hidden = true;
            }
        }
        else{

            auth.textContent =
                "Log In";

            auth.href =
                "/login.html";

            auth.setAttribute(
                "aria-label",
                "Log in to EdgeBreak"
            );

            if(buy){
                buy.hidden = false;
            }
        }
    }

    async function readSession(){

        if(!isMobile()){
            return;
        }

        /*
           Supabase is already initialised by the EdgeBreak pages.
           Wait briefly if components.js inserted the navbar before
           the page's Supabase client became available.
        */
        if(
            !window.supabaseClient ||
            !window.supabaseClient.auth
        ){
            return false;
        }

        try{

            const {
                data,
                error
            } =
                await window
                    .supabaseClient
                    .auth
                    .getSession();

            if(error){
                throw error;
            }

            setMobileAuthState(
                data?.session?.user ||
                null
            );

            return true;
        }
        catch(error){

            console.warn(
                "EdgeBreak mobile navbar session check failed:",
                error
            );

            setMobileAuthState(
                null
            );

            return true;
        }
    }

    function installMobileAuthClick(){

        const {
            auth
        } = getNavElements();

        if(
            !auth ||
            auth.dataset.mobileAuthBound ===
                "true"
        ){
            return;
        }

        auth.dataset.mobileAuthBound =
            "true";

        /*
           Capture phase means the mobile navbar gets one clear
           Login/Logout action even if older shared auth code also
           attached a click listener.
        */
        auth.addEventListener(
            "click",
            async function(event){

                if(!isMobile()){
                    return;
                }

                if(
                    auth.dataset.authState !==
                    "logged-in"
                ){
                    event.preventDefault();
                    event.stopImmediatePropagation();

                    window.location.href =
                        "/login.html";

                    return;
                }

                event.preventDefault();
                event.stopImmediatePropagation();

                auth.textContent =
                    "Logging Out…";

                try{

                    if(
                        window.supabaseClient?.auth
                    ){
                        await window
                            .supabaseClient
                            .auth
                            .signOut();
                    }

                }
                catch(error){

                    console.error(
                        "EdgeBreak logout failed:",
                        error
                    );

                }
                finally{

                    window.location.href =
                        "/index.html";

                }

            },
            true
        );
    }

    function clearBlueTapState(){

        if(!isMobile()){
            return;
        }

        document
            .querySelectorAll(
                ".nav a, .nav .menu-toggle"
            )
            .forEach(
                element => {

                    if(
                        element.dataset
                            .mobileBlurBound ===
                        "true"
                    ){
                        return;
                    }

                    element.dataset
                        .mobileBlurBound =
                        "true";

                    element.addEventListener(
                        "click",
                        () => {
                            setTimeout(
                                () => {
                                    element.blur?.();
                                },
                                80
                            );
                        }
                    );

                }
            );
    }

    async function initialise(){

        if(!isMobile()){
            return;
        }

        installMobileAuthClick();
        clearBlueTapState();

        const loaded =
            await readSession();

        if(loaded){
            return;
        }

        /*
           Retry because the navbar component can load before
           Supabase is ready on some pages.
        */
        let attempts = 0;

        const timer =
            setInterval(
                async () => {

                    attempts++;

                    installMobileAuthClick();
                    clearBlueTapState();

                    const ready =
                        await readSession();

                    if(
                        ready ||
                        attempts >= 20
                    ){
                        clearInterval(
                            timer
                        );
                    }

                },
                150
            );
    }

    initialise();

    window.addEventListener(
        "resize",
        () => {

            if(isMobile()){
                initialise();
            }

        }
    );

    /*
       If Supabase is already ready, keep the navbar synced after
       login/logout changes without refreshing the page.
    */
    setTimeout(
        () => {

            if(
                window.supabaseClient?.auth
            ){
                window
                    .supabaseClient
                    .auth
                    .onAuthStateChange(
                        (
                            event,
                            session
                        ) => {

                            if(isMobile()){
                                setMobileAuthState(
                                    session?.user ||
                                    null
                                );
                            }

                        }
                    );
            }

        },
        500
    );

})();
</script>
